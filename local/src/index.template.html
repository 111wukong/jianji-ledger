<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>简记 · 本地记账</title>
<style>
:root{
  --bg:#0d1117;--surface:#151b23;--surface2:#1b222c;--surface3:#232c38;
  --border:#28313d;--border2:#212a35;--text:#e9eef5;--text2:#9aa7b8;--text3:#69788a;
  --accent:#7b8cff;--accent2:rgba(123,140,255,.14);
  --expense:#ff7f70;--income:#3ddc97;--warn:#ffb454;
  --shadow:0 18px 50px rgba(0,0,0,.42);--r:14px;
}
html[data-theme="light"]{
  --bg:#f4f6fa;--surface:#ffffff;--surface2:#f4f7fb;--surface3:#eaeef5;
  --border:#e1e7ef;--border2:#edf1f6;--text:#1b2532;--text2:#5d6b7e;--text3:#8d9aab;
  --accent:#4d68e8;--accent2:rgba(77,104,232,.10);
  --expense:#e2564d;--income:#12a86b;--warn:#c9830f;
  --shadow:0 18px 50px rgba(30,50,85,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.icon-defs{position:absolute;width:0;height:0;overflow:hidden}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.app{display:flex;min-height:100vh}

.sidebar{width:228px;flex:0 0 228px;border-right:1px solid var(--border2);padding:26px 14px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--surface)}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 28px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:600;letter-spacing:-1px}
.brand-name{font-size:16px;font-weight:600;letter-spacing:.5px}
.brand-sub{font-size:11px;color:var(--text3);letter-spacing:.3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--text2);font-size:13.5px;transition:.15s;text-align:left;width:100%}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent2);color:var(--accent);font-weight:500}
.nav-item .ic{width:17px;height:17px}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--border2)}
.side-note{font-size:11px;color:var(--text3);line-height:1.7}
.side-note b{color:var(--text2);font-weight:500}

.main{flex:1;min-width:0;padding:26px 34px 70px;max-width:1480px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.topbar h1{font-size:22px;font-weight:600;letter-spacing:-.3px}
.topbar p{font-size:12.5px;color:var(--text3);margin-top:3px}
.topbar-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.month-ctrl{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
.month-ctrl button{width:28px;height:28px;border-radius:7px;color:var(--text2);display:grid;place-items:center}
.month-ctrl button:hover{background:var(--surface2);color:var(--text)}
.month-ctrl span{min-width:104px;text-align:center;font-size:13px;font-weight:500}
.icon-btn{width:36px;height:36px;border:1px solid var(--border);border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--text2)}
.icon-btn:hover{color:var(--text);background:var(--surface2)}
.btn-primary{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:500;box-shadow:0 4px 14px rgba(90,110,240,.22)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:10px;padding:8px 13px;font-size:13px;color:var(--text2);background:var(--surface)}
.btn-ghost:hover{color:var(--text);background:var(--surface2)}
.btn-danger{color:var(--expense);border-color:rgba(255,127,112,.3)}

.banner{display:flex;align-items:center;gap:10px;background:var(--accent2);border:1px solid rgba(123,140,255,.25);border-radius:11px;padding:10px 14px;margin-bottom:20px;font-size:12.5px;color:var(--text2)}
.banner strong{color:var(--accent);font-weight:500}
.banner .spacer{flex:1}

.card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:18px 20px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600}
.card-sub{font-size:11.5px;color:var(--text3)}
.grid{display:grid;gap:14px}
.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
.charts{grid-template-columns:minmax(0,1fr) minmax(0,1.28fr);margin-top:14px}
.lower{grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:14px}
.metric .label{font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:7px}
.metric .dot{width:7px;height:7px;border-radius:50%}
.metric .value{font-size:27px;font-weight:600;letter-spacing:-.8px;margin:9px 0 7px}
.metric .foot{font-size:11.5px;color:var(--text3)}
.metric .chip{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;margin-right:5px}
.chip.up{background:rgba(255,127,112,.13);color:var(--expense)}
.chip.down{background:rgba(61,220,151,.13);color:var(--income)}
.chip.flat{background:var(--surface3);color:var(--text3)}

.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:172px;height:172px;flex:0 0 172px;position:relative}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center .v{font-size:19px;font-weight:600;letter-spacing:-.5px}
.donut-center .l{font-size:11px;color:var(--text3);margin-top:2px}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:9px;max-height:190px;overflow:auto}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend-row .sw{width:8px;height:8px;border-radius:3px;flex:0 0 8px}
.legend-row .nm{flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-row .vl{font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
.legend-row .pc{font-size:11px;color:var(--text3);width:36px;text-align:right;font-variant-numeric:tabular-nums}

.chart-legend{display:flex;gap:14px;font-size:11.5px;color:var(--text2)}
.chart-legend span{display:flex;align-items:center;gap:5px}
.chart-legend i{width:9px;height:9px;border-radius:2px;display:block}
.bars{width:100%;height:196px;display:block}

.budget-row{padding:11px 0;border-bottom:1px solid var(--border2)}
.budget-row:last-child{border-bottom:0;padding-bottom:0}
.budget-row:first-child{padding-top:0}
.br-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:12.5px}
.br-top .nm{flex:1}
.br-top .v{font-variant-numeric:tabular-nums;color:var(--text2)}
.bar{height:6px;border-radius:6px;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .3s}

.tx-day{margin-bottom:18px}
.tx-day-h{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text3);padding:0 2px 8px;border-bottom:1px solid var(--border2);margin-bottom:4px}
.tx-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-radius:10px;cursor:pointer;transition:.12s}
.tx-row:hover{background:var(--surface2)}
.cat-badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:14px;font-weight:500;flex:0 0 36px}
.tx-main{flex:1;min-width:0}
.tx-main .t1{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-main .t2{font-size:11.5px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt.expense{color:var(--text)}
.tx-amt.income{color:var(--income)}
.tx-amt.transfer{color:var(--text2)}
.tx-tools{display:flex;gap:2px;opacity:0;transition:.12s}
.tx-row:hover .tx-tools{opacity:1}
.tx-tools button{width:28px;height:28px;border-radius:7px;color:var(--text3);display:grid;place-items:center}
.tx-tools button:hover{background:var(--surface3);color:var(--text)}

.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 11px;height:36px;min-width:210px;flex:1;max-width:320px;color:var(--text3)}
.search input{border:0;outline:0;background:none;width:100%;font-size:13px;color:var(--text)}
.search input::placeholder{color:var(--text3)}
select.sel,input.inp,textarea.inp{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:13px;outline:0;color:var(--text);height:36px}
select.sel:focus,input.inp:focus,textarea.inp:focus{border-color:var(--accent)}
textarea.inp{height:auto;resize:vertical;min-height:64px;width:100%;line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:12px;color:var(--text2)}

.empty{text-align:center;padding:52px 20px;color:var(--text3)}
.empty .ic{width:34px;height:34px;opacity:.5;margin-bottom:10px}
.empty p{font-size:13px}

.acct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.acct{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:18px;position:relative}
.acct .an{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px}
.acct .av{font-size:23px;font-weight:600;letter-spacing:-.6px;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.acct .ax{font-size:11.5px;color:var(--text3)}
.acct .ops{position:absolute;top:12px;right:12px;display:flex;gap:2px;opacity:0;transition:.12s}
.acct:hover .ops{opacity:1}
.acct .ops button{width:26px;height:26px;border-radius:6px;color:var(--text3);display:grid;place-items:center}
.acct .ops button:hover{background:var(--surface3);color:var(--text)}

.settings-sec{margin-bottom:14px}
.settings-sec .card-head{margin-bottom:14px}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--border2);flex-wrap:wrap}
.opt-row:last-child{border-bottom:0;padding-bottom:0}
.opt-row:first-child{padding-top:0}
.opt-t{font-size:13px;font-weight:500}
.opt-d{font-size:11.5px;color:var(--text3);margin-top:2px;max-width:520px;line-height:1.6}
.seg{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--border);padding:3px;border-radius:9px}
.seg button{padding:5px 12px;border-radius:6px;font-size:12px;color:var(--text2)}
.seg button.on{background:var(--accent2);color:var(--accent);font-weight:500}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.cat-manage{display:flex;flex-wrap:wrap;gap:8px}
.cat-chip{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:6px 9px;font-size:12.5px}
.cat-chip button{color:var(--text3);display:grid;place-items:center}
.cat-chip button:hover{color:var(--expense)}

.mask{position:fixed;inset:0;background:rgba(4,8,14,.66);backdrop-filter:blur(3px);z-index:40;animation:fade .16s ease}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100vw - 28px));max-height:min(88vh,900px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);animation:pop .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px}
.modal-head h3{font-size:16px;font-weight:600}
.modal-head button{width:28px;height:28px;border-radius:8px;color:var(--text3);display:grid;place-items:center}
.modal-head button:hover{background:var(--surface2);color:var(--text)}
.modal-body{padding:0 20px 20px}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px 18px;border-top:1px solid var(--border2)}
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:8px;border-radius:7px;font-size:13px;color:var(--text2)}
.tabs button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tabs button.on[data-type="expense"]{color:var(--expense)}
.tabs button.on[data-type="income"]{color:var(--income)}
.amount-box{border-bottom:1px solid var(--border);padding:4px 0 12px;margin-bottom:16px;display:flex;align-items:baseline;gap:8px}
.amount-box .cur{font-size:22px;color:var(--text3)}
.amount-box input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:36px;font-weight:600;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;color:var(--text)}
.amount-box input::placeholder{color:var(--text3);opacity:.55}
.cat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:16px}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:10px;border:1px solid transparent;font-size:11px;color:var(--text2);transition:.12s}
.cat-opt:hover{background:var(--surface2)}
.cat-opt.on{border-color:var(--accent);background:var(--accent2);color:var(--text)}
.cat-opt .cat-badge{width:32px;height:32px;flex:0 0 32px;font-size:13px;border-radius:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-grid .full{grid-column:1/-1}
.form-grid .inp,.form-grid .sel{width:100%}
.hint{font-size:11.5px;color:var(--text3);line-height:1.7;background:var(--surface2);border-radius:9px;padding:10px 12px;margin-top:12px}
.preview{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:10px}
.preview th,.preview td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.preview th{color:var(--text3);font-weight:400}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:11px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.22s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(255,127,112,.5);color:var(--expense)}
.tabbar{display:none}

.book-sel{font-weight:500;border-color:var(--accent);color:var(--accent);max-width:132px}
.book-card{background:var(--surface2);border:1px solid var(--border2);border-radius:11px;padding:11px 12px;margin:0 2px 18px}
.book-card .bc-label{font-size:10.5px;color:var(--text3);letter-spacing:.3px}
.book-card .bc-name{font-size:13px;font-weight:500;margin-top:2px}
.book-card .bc-bal{font-size:18px;font-weight:600;margin-top:7px;letter-spacing:-.4px}
.book-card .bc-foot{font-size:10.5px;color:var(--text3);margin-top:2px}
.cash-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.cash-summary .cs{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:15px 16px}
.cash-summary .cs .l{font-size:11.5px;color:var(--text2)}
.cash-summary .cs .v{font-size:20px;font-weight:600;margin-top:6px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.cash-scroll{overflow-x:auto}
.cash-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px}
.cash-table th{text-align:left;font-size:11px;color:var(--text3);font-weight:400;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.cash-table td{padding:10px;border-bottom:1px solid var(--border2);vertical-align:middle}
.cash-table td.r,.cash-table th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cash-table tr:hover td{background:var(--surface2)}
.cash-table .open td{background:var(--surface2);color:var(--text2);font-size:12px}
.cash-table .inc{color:var(--income)}
.cash-table .dec{color:var(--expense)}
.cash-table .bal{font-weight:500}
.cash-table .vno{font-size:11px;color:var(--text3);white-space:nowrap}
.tx-tabs{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--border);padding:3px;border-radius:9px}
.tx-tabs button{padding:5px 12px;border-radius:6px;font-size:12px;color:var(--text2)}
.tx-tabs button.on{background:var(--accent2);color:var(--accent);font-weight:500}
.report-actions{display:flex;gap:8px;flex-wrap:wrap}
.score-box{display:flex;align-items:center;gap:16px;padding:4px 0 18px;border-bottom:1px solid var(--border2);margin-bottom:6px}
.score-num{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:600;letter-spacing:-1px;flex:0 0 74px;border:6px solid var(--accent);color:var(--accent)}
.score-txt .t1{font-size:14px;font-weight:600}
.score-txt .t2{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.7;max-width:600px}
.insight{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border2)}
.insight:last-child{border-bottom:0;padding-bottom:0}
.insight-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 32px;font-size:12px;font-weight:600}
.insight-b{flex:1;min-width:0}
.insight-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.insight-t{font-size:13px;font-weight:500}
.insight-tag{font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--surface3);color:var(--text3)}
.insight-tag.warn{background:rgba(255,180,84,.14);color:var(--warn)}
.insight-tag.bad{background:rgba(255,127,112,.14);color:var(--expense)}
.insight-tag.good{background:rgba(61,220,151,.14);color:var(--income)}
.insight-d{font-size:12px;color:var(--text2);line-height:1.75;margin-top:4px}
.insight-d b{color:var(--text);font-weight:500}
.roadmap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.roadmap .rm{background:var(--surface2);border:1px solid var(--border2);border-radius:11px;padding:13px}
.roadmap .rm .n{font-size:10.5px;color:var(--accent);letter-spacing:.5px}
.roadmap .rm .h{font-size:13px;font-weight:500;margin:5px 0}
.roadmap .rm .d{font-size:11.5px;color:var(--text3);line-height:1.7}

.print-report{display:none;--surface:#fff;--surface2:#f4f7fb;--surface3:#eaeef5;--border:#dfe5ec;--border2:#e6ebf1;--text:#1b2430;--text2:#5d6b7e;--text3:#8d9aab;--accent:#4d68e8;--accent2:rgba(77,104,232,.1);--shadow:0 12px 40px rgba(20,40,70,.14)}
body.report-mode{background:#e8ecf3}
body.report-mode .app,body.report-mode .tabbar{display:none}
body.report-mode .print-report{display:block;max-width:850px;margin:22px auto 50px;padding:0 16px}
body.report-mode .print-report .rp{border-radius:5px;box-shadow:var(--shadow)}
.rp{background:#fff;color:#1b2430;padding:26px 30px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.rp h1{font-size:21px;font-weight:600;margin:0}
.rp .rp-sub{font-size:11px;color:#6b7887;margin-top:5px}
.rp-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1b2430;padding-bottom:14px;margin-bottom:18px}

<script>
'use strict';
/* ============================================================
   简记 · 本地记账
   分层设计（为后续上云 / 小程序 / LLM 预留）：
   [1] 基础设施 + 默认数据
   [2] Storage 适配层  —— 换云同步只需替换本层
   [3] Analytics 纯计算层 —— 无 DOM / 无存储，小程序与云函数可直接复用
   [4] AIProvider —— 本地洞察实现 + 云端大模型接口占位
   [5] 渲染层 / [6] 导出层 / [7] 交互层
   ============================================================ */

/* ---------- [1] 基础设施 ---------- */
const KEY = 'jianji.ledger.v1';
const SCHEMA = 3;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yuan = c => (c / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = c => (c < 0 ? '-¥' : '¥') + yuan(Math.abs(c));
const fmt0 = c => (c < 0 ? '-¥' : '¥') + Math.round(Math.abs(c) / 100).toLocaleString('zh-CN');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const curMonth = () => todayStr().slice(0, 7);
const ymLabel = ym => ym.slice(0, 4) + '年' + Number(ym.slice(5)) + '月';
const dayLabel = ds => { const p = ds.split('-'); return Number(p[1]) + '月' + Number(p[2]) + '日'; };
const weekLabel = ds => '周' + '日一二三四五六'[new Date(+ds.slice(0,4), +ds.slice(5,7)-1, +ds.slice(8,10)).getDay()];
function shiftMonth(ym, d) { let y = +ym.slice(0,4), m = +ym.slice(5) + d; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } return y + '-' + pad(m); }
function monthDays(ym) { return new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate(); }
function parseAmount(v) { const n = Number(String(v == null ? '' : v).replace(/[^\d.]/g, '')); return Number.isFinite(n) ? Math.round(n * 100) : 0; }

const EXP_CATS = [
  ['food','餐饮','#ff8a65',120000],['transport','交通','#5b9dff',30000],
  ['shopping','购物','#f47cb4',60000],['housing','居住','#9b8cff',150000],
  ['daily','日用','#4fc3a1',30000],['fun','娱乐','#ffb74d',40000],
  ['health','医疗','#ef6e6e',20000],['study','学习','#42b8c9',20000],
  ['social','人情','#d68cf0',30000],['phone','通讯','#7f9cf5',10000],
  ['travel','旅行','#52c7a3',30000],['other','其他','#8b97a8',20000]
];
const INC_CATS = [
  ['salary','工资','#3ddc97',0],['bonus','奖金','#5bc98a',0],['parttime','兼职','#78b6ff',0],
  ['invest','理财','#9b8cff',0],['gift','红包','#ff8a65',0],['refund','报销','#ffb74d',0],['other','其他','#8b97a8',0]
];
const ACC_DEFS = [
  ['a_cash','现金','#ffb454'],['a_bank','银行卡','#5b9dff'],
  ['a_wx','微信','#3ddc97'],['a_ali','支付宝','#7b8cff'],['a_cc','信用卡','#ff7f70']
];
const TYPE_NAME = { expense: '支出', income: '收入', transfer: '转账' };
const COMPANY_TYPE_NAME = { expense: '减少', income: '增加', transfer: '转账' };
const typeLabel = t => (state && state.type === 'company' ? COMPANY_TYPE_NAME : TYPE_NAME)[t];
const isCompany = () => !!(state && state.type === 'company');
const PAGES = [
  ['dash','总览','ic-home'],['tx','明细','ic-list'],['insight','AI 洞察','ic-chart'],
  ['budget','预算','ic-chart'],['accounts','账户','ic-wallet'],['settings','设置','ic-gear']
];
const COMPANY_ACCS = [
  ['a_cash','现金备用金','#ffb454'],['a_bank','对公账户','#5b9dff'],
  ['a_advance','个人垫付','#d68cf0'],['a_wx','微信','#3ddc97']
];
const COMPANY_EXP = [
  ['purchase','采购','#ff8a65',600000],['travel','差旅','#5b9dff',200000],
  ['office','办公','#4fc3a1',100000],['entertain','招待','#f47cb4',150000],
  ['labor','劳务','#9b8cff',300000],['tax','税费','#ef6e6e',100000],
  ['refundpay','退款','#ffb74d',50000],['other','其他','#8b97a8',100000]
];
const COMPANY_INC = [
  ['allocate','公司拨款','#3ddc97'],['receipt','客户回款','#5bc98a'],
  ['reimburse','报销到账','#78b6ff'],['return','退回款','#9b8cff'],['other','其他','#8b97a8']
];

function blankState(type) {
  const company = type === 'company';
  const expCats = company ? COMPANY_EXP : EXP_CATS;
  const incCats = company ? COMPANY_INC : INC_CATS;
  return {
    id: company ? 'company' : 'personal',
    name: company ? '公司账' : '个人账',
    type: company ? 'company' : 'personal',
    demo: false,
    budgets: { total: company ? 1600000 : 500000 },
    accounts: (company ? COMPANY_ACCS : ACC_DEFS).map(a => ({ id: a[0], name: a[1], color: a[2], initial: 0 })),
    categories: [
      ...expCats.map(c => ({ id: 'e_' + c[0], name: c[1], color: c[2], type: 'expense', budget: c[3] || 0 })),
      ...incCats.map(c => ({ id: 'i_' + c[0], name: c[1], color: c[2], type: 'income', budget: 0 }))
    ],
    tx: []
  };
}

/* ---------- [2] Storage 适配层 ---------------------------------
   目前 LocalAdapter。上云时只需实现同样 4 个方法的 CloudAdapter：
   load / save / clear / migrate，界面层与计算层不用改。          */
const Storage = {
  adapter: 'local',
  load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      return this.migrate(JSON.parse(raw));
    } catch (e) { console.warn('读取本地数据失败', e); return null; }
  },
  save(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); return true; }
    catch (e) { toast('保存失败，本地存储可能已满', 'err'); return false; }
  },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
  /* 兼容 v1 单账本数据：自动包装成「个人账」，再补一个空的「公司账」 */
  migrate(s) {
    if (!s || typeof s !== 'object') return null;
    if (s.books && typeof s.books === 'object') {
      s.version = SCHEMA;
      s.settings = Object.assign({ theme: 'dark' }, s.settings || {});
      s.activeBook = s.books[s.activeBook] ? s.activeBook : Object.keys(s.books)[0];
      for (const k in s.books) s.books[k] = this.migrateBook(s.books[k], k);
      return s;
    }
    const personal = this.migrateBook(s, 'personal');
    personal.id = 'personal'; personal.name = '个人账'; personal.type = 'personal';
    const company = seedCompanyDemo();
    company.id = 'company'; company.name = '公司账'; company.type = 'company';
    return { version: SCHEMA, activeBook: 'personal',
      settings: { theme: (s.settings && s.settings.theme) || 'dark' },
      books: { personal, company } };
  },
  migrateBook(b, id) {
    b = b && typeof b === 'object' ? b : {};
    const base = blankState(b.type === 'company' ? 'company' : 'personal');
    b.id = b.id || id; b.name = b.name || base.name; b.type = b.type || base.type;
    b.demo = !!b.demo;
    b.budgets = Object.assign(base.budgets, b.budgets || {});
    b.accounts = Array.isArray(b.accounts) && b.accounts.length ? b.accounts : base.accounts;
    b.categories = Array.isArray(b.categories) && b.categories.length ? b.categories : base.categories;
    b.tx = Array.isArray(b.tx) ? b.tx : [];
    return b;
  }
};

/* ---------- [3] Analytics 纯计算层 -----------------------------
   全部为 (state, 参数) => 结果 的纯函数，不依赖 DOM / localStorage。
   迁移到微信小程序或云函数时可整段复制复用。                     */
const Analytics = {
  inMonth(tx, ym) { return tx.filter(t => String(t.date).slice(0, 7) === ym); },
  totals(list) {
    let income = 0, expense = 0, transfers = 0;
    for (const t of list) {
      if (t.type === 'income') income += t.amount;
      else if (t.type === 'expense') expense += t.amount;
      else transfers++;
    }
    return { income, expense, net: income - expense, count: list.length - transfers };
  },
  byCategory(list, type, categories) {
    const m = new Map();
    for (const t of list) if (t.type === type) m.set(t.categoryId, (m.get(t.categoryId) || 0) + t.amount);
    return Array.from(m, ([id, amount]) => {
      const c = categories.find(x => x.id === id);
      return { id, name: c ? c.name : '未分类', color: c ? c.color : '#8b97a8', amount };
    }).sort((a, b) => b.amount - a.amount);
  },
  series(tx, endYm, n) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const ym = shiftMonth(endYm, -i);
      out.push(Object.assign({ ym }, this.totals(this.inMonth(tx, ym))));
    }
    return out;
  },
  daily(tx, ym) {
    const days = monthDays(ym), arr = new Array(days).fill(0);
    for (const t of tx) if (t.type === 'expense' && String(t.date).slice(0,7) === ym) {
      const d = +String(t.date).slice(8,10); if (d >= 1 && d <= days) arr[d-1] += t.amount;
    }
    return arr;
  },
  /* 资金台账：按时间正序逐笔滚动余额，转账不改变资金总额 */
  cashFlow(state, ym) {
    let bal = state.accounts.reduce((s, a) => s + (a.initial || 0), 0);
    const all = state.tx.slice().sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
    const rows = [];
    for (const t of all) {
      const inc = t.type === 'income' ? t.amount : 0;
      const dec = t.type === 'expense' ? t.amount : 0;
      const opening = bal;
      bal += inc - dec;
      if (String(t.date).slice(0, 7) === ym) rows.push({ t: t, inc: inc, dec: dec, balance: bal, opening: opening });
    }
    return {
      rows: rows, start: rows.length ? rows[0].opening : bal, end: bal,
      current: bal, incTotal: rows.reduce((s, r) => s + r.inc, 0),
      decTotal: rows.reduce((s, r) => s + r.dec, 0)
    };
  },
  balances(state) {
    const m = new Map(state.accounts.map(a => [a.id, a.initial || 0]));
    for (const t of state.tx) {
      if (t.type === 'income') m.set(t.accountId, (m.get(t.accountId) || 0) + t.amount);
      else if (t.type === 'expense') m.set(t.accountId, (m.get(t.accountId) || 0) - t.amount);
      else if (t.type === 'transfer') {
        m.set(t.accountId, (m.get(t.accountId) || 0) - t.amount);
        m.set(t.toAccountId, (m.get(t.toAccountId) || 0) + t.amount);
      }
    }
    return m;
  },
  budgetRows(state, ym) {
    const list = this.inMonth(state.tx, ym);
    const spent = new Map(this.byCategory(list, 'expense', state.categories).map(r => [r.id, r.amount]));
    const rows = state.categories.filter(c => c.type === 'expense' && (c.budget || 0) > 0)
      .map(c => ({ id: c.id, name: c.name, color: c.color, budget: c.budget, used: spent.get(c.id) || 0 }))
      .sort((a, b) => b.used - a.used);
    const total = this.totals(list).expense;
    return { rows, total, limit: state.budgets.total || 0, overallUsed: total };
  },
  /* 本地「AI」洞察：统计 + 规则，生成可读结论，不联网、不上传任何数据 */
  insights(state, ym) {
    const cards = [];
    const cur = this.totals(this.inMonth(state.tx, ym));
    const series = this.series(state.tx, ym, 6);
    const prev = series[4] || { income: 0, expense: 0 };
    const hist = series.slice(0, 5);
    const avgExpense = hist.reduce((s, x) => s + x.expense, 0) / 5;
    const avgIncome = hist.reduce((s, x) => s + x.income, 0) / 5;
    const saveRate = cur.income > 0 ? (cur.income - cur.expense) / cur.income : 0;
    const cats = this.byCategory(this.inMonth(state.tx, ym), 'expense', state.categories);
    const prevCats = this.byCategory(this.inMonth(state.tx, shiftMonth(ym, -1)), 'expense', state.categories);
    const pct = (a, b) => b > 0 ? Math.round((a - b) / b * 100) : 0;
    const rateTag = v => v > 0 ? '较上月 +' + v + '%' : v < 0 ? '较上月 ' + v + '%' : '与上月持平';

    let score = 50;
    score += clamp(Math.round(saveRate * 60), -25, 30);
    if (state.budgets.total > 0) score -= clamp(Math.round((cur.expense / state.budgets.total - 1) * 40), 0, 25);
    if (avgExpense > 0 && cur.expense < avgExpense) score += 8;
    score = clamp(Math.round(score), 0, 100);

    cards.push({
      level: saveRate >= 0.3 ? 'good' : saveRate >= 0.1 ? '' : 'bad',
      icon: '储', title: (state.type === 'company' ? '本月净流入率 ' : '本月储蓄率 ') + Math.round(saveRate * 100) + '%',
      tag: '收支结构',
      body: '收入 <b>' + fmt(cur.income) + '</b>，支出 <b>' + fmt(cur.expense) + '</b>，结余 <b>' + fmt(cur.net) + '</b>。' +
        (avgIncome > 0 ? '近 5 个月平均月收入 ' + fmt0(avgIncome) + '，本月' + (cur.income >= avgIncome ? '高于' : '低于') + '均值 ' + fmt0(Math.abs(cur.income - avgIncome)) + '。' : '') +
        (saveRate >= 0.3 ? ' 储蓄率健康，继续保持。' : saveRate >= 0.1 ? ' 有一定结余，仍有压缩空间。' : ' 本月结余偏薄，建议优先控制大额非必要支出。')
    });

    if (cats.length) {
      const top = cats[0], share = cur.expense > 0 ? Math.round(top.amount / cur.expense * 100) : 0;
      const before = prevCats.find(c => c.id === top.id);
      const delta = before ? pct(top.amount, before.amount) : null;
      cards.push({
        level: share > 45 ? 'warn' : '', icon: '类', title: (state.type === 'company' ? '最大出账：' : '最大支出：') + top.name + '（占比 ' + share + '%）',
        tag: delta == null ? '分类结构' : rateTag(delta),
        body: '本月在<b>' + esc(top.name) + '</b>上花了 <b>' + fmt(top.amount) + '</b>，共 ' +
          this.inMonth(state.tx, ym).filter(t => t.type === 'expense' && t.categoryId === top.id).length + ' 笔。' +
          (delta != null && delta > 20 ? ' 该分类较上月明显上升，值得留意。' : delta != null && delta < -20 ? ' 该分类较上月下降明显。' : '') +
          (share > 45 ? ' 单一分类占比过高，支出结构比较集中。' : '')
      });
    }

    const expTx = this.inMonth(state.tx, ym).filter(t => t.type === 'expense');
    const avgTicket = expTx.length ? cur.expense / expTx.length : 0;
    const big = expTx.filter(t => t.amount > avgTicket * 3 && t.amount >= 30000).sort((a,b) => b.amount - a.amount).slice(0, 3);
    if (big.length) {
      cards.push({
        level: 'warn', icon: '异', title: '检测到 ' + big.length + ' 笔异常大额支出',
        tag: '异常识别',
        body: '本月平均每笔支出 ' + fmt0(avgTicket) + '，以下单笔超过均值 3 倍：' +
          big.map(t => '<b>' + esc(catName(state, t.categoryId)) + ' ' + fmt(t.amount) + '</b>（' + dayLabel(t.date) + (t.note ? '，' + esc(t.note) : '') + '）').join('、') + '。'
      });
    }

    const b = this.budgetRows(state, ym);
    const over = b.rows.filter(r => r.used > r.budget);
    const near = b.rows.filter(r => r.used <= r.budget && r.used >= r.budget * 0.85);
    if (over.length || near.length || (b.limit > 0 && b.total > b.limit)) {
      cards.push({
        level: over.length || b.total > b.limit ? 'bad' : 'warn', icon: '预', title: '预算执行情况',
        tag: over.length ? over.length + ' 项超支' : '临界提醒',
        body: (b.limit > 0 ? '本月总支出 ' + fmt(b.total) + ' / 总预算 ' + fmt(b.limit) + '（' + Math.round(b.total / b.limit * 100) + '%）。' : '') +
          (over.length ? ' 已超支：<b>' + over.map(r => esc(r.name) + ' ' + fmt(r.used - r.budget)).join('、') + '</b>。' : '') +
          (near.length ? ' 接近上限：' + near.map(r => esc(r.name) + '（' + Math.round(r.used / r.budget * 100) + '%）').join('、') + '。' : '')
      });
    }

    const fixed = [];
    for (const c of state.categories.filter(x => x.type === 'expense')) {
      const hits = series.slice(0, 5).map(s => this.inMonth(state.tx, s.ym).filter(t => t.type === 'expense' && t.categoryId === c.id).reduce((a, t) => a + t.amount, 0));
      const nz = hits.filter(v => v >= 10000);
      if (nz.length >= 4) {
        const avg = nz.reduce((a, v) => a + v, 0) / nz.length;
        if (nz.every(v => Math.abs(v - avg) / avg < 0.35)) fixed.push(esc(c.name) + ' 约 ' + fmt0(avg) + '/月');
      }
    }
    if (fixed.length) cards.push({
      level: 'good', icon: '固', title: '识别出 ' + fixed.length + ' 项固定支出',
      tag: '模式识别',
      body: '连续多月金额稳定：<b>' + fixed.join('、') + '</b>。这类属于刚性开支，压缩空间小；做预算时建议先扣除它们，再分配可支配额度。'
    });

    const nonEmpty = series.slice(0, 5).filter(s => s.expense > 0);
    if (nonEmpty.length >= 3) {
      const n = nonEmpty.length, xs = nonEmpty.map((_, i) => i), ys = nonEmpty.map(s => s.expense);
      const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
      const slope = xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0) / (xs.reduce((a,x)=>a+(x-mx)**2,0)||1);
      const forecast = Math.max(0, Math.round(my + slope * n));
      const trend = Math.abs(slope) < my * 0.03 ? '基本平稳' : slope > 0 ? '持续上升' : '逐步下降';
      cards.push({
        level: slope > my * 0.08 ? 'warn' : '', icon: '势', title: '支出趋势' + trend + '，下月预计 ' + fmt0(forecast),
        tag: '趋势预测',
        body: '近 ' + n + ' 个月月均支出 <b>' + fmt0(my) + '</b>，线性拟合月变化 ' + (slope >= 0 ? '+' : '-') + fmt0(Math.abs(slope)) + '。' +
          '按当前节奏，下月支出约 <b>' + fmt0(forecast) + '</b>。' + (slope > my * 0.08 ? ' 增速偏快，建议提前设好分类上限。' : '')
      });
    }

    const advice = [];
    const food = cats.find(c => c.name === '餐饮');
    if (food && cur.expense > 0 && food.amount / cur.expense > 0.38) advice.push('餐饮占支出 ' + Math.round(food.amount / cur.expense * 100) + '%，若把外卖频次降三成，每月约可省下 ' + fmt0(food.amount * 0.3) + '。');
    if (saveRate < 0.1 && cur.income > 0) advice.push('建议先固定转出收入的 10%（约 ' + fmt0(cur.income * 0.1) + '）到独立账户，再安排消费。');
    const small = expTx.filter(t => t.amount < 3000).length;
    if (small > expTx.length * 0.6 && expTx.length > 10) advice.push('本月有 ' + small + ' 笔 30 元以下的小额支出，小额高频最容易在月底形成"钱不知道花哪了"。');
    if (!advice.length) advice.push('本月结构均衡、没有明显异常，保持当前记账节奏即可。');
    cards.push({ level: 'good', icon: '策', title: '给你的 ' + Math.min(3, advice.length) + ' 条可执行建议', tag: '行动建议', body: advice.slice(0, 3).map((a, i) => (i+1) + '. ' + a).join('<br>') });
    return { score, cards, cur, series, cats, generatedAt: new Date().toLocaleString('zh-CN') };
  }
};

/* ---------- [4] AIProvider ------------------------------------
   现阶段 mode='local'：完全本地统计，零联网、零费用、零隐私风险。
   上云后把 mode 改成 'cloud' 并实现 remote()，即可换成人话版
   月度报告 / 对话式问账，界面层无需改动。                        */
const AIProvider = {
  mode: 'local',
  async report(state, ym) { return { engine: 'local', ...Analytics.insights(state, ym) }; },
  async remote(facts, prompt) { throw new Error('尚未接入云端大模型：请在 AIProvider.remote 中调用云端 LLM 接口'); }
};

function catOf(state, id) { return state.categories.find(c => c.id === id) || null; }
function catName(state, id) { const c = catOf(state, id); return c ? c.name : '未分类'; }
function accOf(state, id) { return state.accounts.find(a => a.id === id) || null; }
function accName(state, id) { const a = accOf(state, id); return a ? a.name : '已删除账户'; }
function badge(state, id, big) {
  const c = catOf(state, id);
  const color = c ? c.color : '#8b97a8', name = c ? c.name : '未分类';
  return '<span class="cat-badge" style="background:' + color + '22;color:' + color + '">' + esc(name.slice(0, 1)) + '</span>';
}

    if (maxDay >= 3) push(ym, 3, 'transfer', null, 100000, 'a_bank', '充值到微信', 'a_wx');
    const n = back === 0 ? Math.max(7, Math.round(maxDay * 0.8)) : 20 + Math.floor(rnd() * 8);
    for (let i = 0; i < n; i++) {

}

   1) 只追加：有 hash 的记录在 UI 与数据层都不提供修改/删除入口
   2) SHA-256 哈希链：每条含 seq / prevHash / hash，任何改动都会断链
   3) 记错用「红字冲销」补一笔反向记录，原记录永久保留
   4) 独立账本文件 .jsonl，脱离浏览器存储，卸载软件不丢         */
/*__LEDGER_CORE__*/
const { GENESIS, digest, chainPayload } = LedgerCore;

async function migrateAllBooks() {

/* 恢复只能「向前」：新数据必须包含当前全部已封存记录且前缀哈希一致，禁止借恢复回退或删史 */
function assertMonotonic(newTx) { return LedgerCore.assertPrefix(state.tx, newTx); }
function assertMonotonicRoot(nr) {
  for (const k of Object.keys(root.books)) {
    const cur = root.books[k].tx.filter(t => t.hash).sort((a,b) => a.seq - b.seq);
    if (!cur.length) continue;
    const nb = nr.books && nr.books[k];
    const nw = nb ? nb.tx.filter(t => t.hash).sort((a,b) => a.seq - b.seq) : [];
    if (nw.length < cur.length || cur.some((t,i) => !nw[i] || nw[i].hash !== t.hash))
      throw new Error('备份里的「' + root.books[k].name + '」比当前账本更旧，拒绝覆盖已封存历史');

async function restoreChain(text, filename) {
  const parsed = LedgerCore.parseBook(text);
  const meta = parsed.meta;
  const targetId = parsed.bookId && root.books[parsed.bookId] ? parsed.bookId : root.activeBook;
  if (targetId !== root.activeBook) {
    root.activeBook = targetId; state = root.books[targetId];
    ui.txView = state.type === 'company' ? 'cash' : 'list';
  }
  const recs = parsed.records;
  const checked = await LedgerCore.verifyRecords(recs, recs[recs.length - 1].hash);
  if (!checked.ok) throw new Error('哈希链在第 ' + checked.broken + ' 条断开，文件可能被改动');
  const prev = checked.head;
  assertMonotonic(recs);
  if (meta) {
    if (Array.isArray(meta.accounts) && meta.accounts.length) state.accounts = meta.accounts;
    if (Array.isArray(meta.categories) && meta.categories.length) state.categories = meta.categories;
    if (meta.budgets) state.budgets = meta.budgets;
  }
  state.tx = recs; state.chain = { head: prev, seq: recs.length, count: recs.length };
  state.demo = false; save(); LedgerFile.sync(); await checkChain(); render();
  toast('已恢复 ' + recs.length + ' 条记录，哈希链校验通过' + (filename ? '（' + filename + '）' : ''));
}

/* 独立账本文件：FileSystemAccess 句柄存 IndexedDB，卸载浏览器后仍可用「选择文件恢复」 */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('jianji.ledger', 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { const db = await idbOpen(); return new Promise((res, rej) => { const q = db.transaction('kv','readonly').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idbOpen(); return new Promise((res, rej) => { const q = db.transaction('kv','readwrite').objectStore('kv').put(v, k); q.onsuccess = () => res(true); q.onerror = () => rej(q.error); }); }
const LedgerFile = {
  handle: null, state: 'none', name: '', bookId: null,
  get supported() { return typeof window.showSaveFilePicker === 'function'; },
  async init() {
    if (!this.supported) { this.state = 'unsupported'; return; }
    try {
      const h = await idbGet('ledgerFileHandle');
      if (h) {
        this.handle = h; this.name = h.name || '账本文件';
        this.bookId = await idbGet('ledgerFileBook') || null;
        const p = h.queryPermission ? await h.queryPermission({ mode: 'readwrite' }) : 'granted';
        this.state = p === 'granted' ? 'bound' : 'need-permission';
      }
    } catch (e) { this.state = 'none'; }
  },
  async bind() {
    if (!this.supported) { toast('当前浏览器不支持绑定本地文件，请用「导出账本文件」备份', 'err'); return; }
    try {
      const h = await window.showSaveFilePicker({ suggestedName: '简记_' + state.name + '_账本.jsonl',
        types: [{ description: '简记不可变账本', accept: { 'application/x-ndjson': ['.jsonl'] } }] });
      this.handle = h; this.name = h.name; this.state = 'bound'; this.bookId = root.activeBook;
      await idbSet('ledgerFileHandle', h);
      await idbSet('ledgerFileBook', root.activeBook);
      await this.sync(true); render(); toast('已绑定账本文件：' + h.name);
    } catch (e) { if (e.name !== 'AbortError') toast('绑定失败：' + e.message, 'err'); }
  },
  async reauth() {
    if (!this.handle) return this.bind();
    const p = await this.handle.requestPermission({ mode: 'readwrite' });
    this.state = p === 'granted' ? 'bound' : 'need-permission';
    if (this.state === 'bound') { await this.sync(true); render(); toast('已重新授权'); }
  },
  async sync(silent) {
    if (!this.handle) return false;
    if (this.bookId && this.bookId !== root.activeBook) return false;
    try {
      const p = this.handle.queryPermission ? await this.handle.queryPermission({ mode: 'readwrite' }) : 'granted';
      if (p !== 'granted') { this.state = 'need-permission'; return false; }
      const w = await this.handle.createWritable();
      await w.write(chainText()); await w.close();
      this.state = 'bound';
      if (!silent) toast('账本已同步到 ' + this.name);
      return true;
    } catch (e) { this.state = 'error'; if (!silent) toast('同步失败：' + e.message, 'err'); return false; }
  }
};

function filteredTx() {
  const f = ui.filter;
  const q = f.q.trim().toLowerCase();
  return state.tx.filter(t => {
    if (f.range === 'month' && String(t.date).slice(0, 7) !== ui.month) return false;
    if (f.range === '3m') {
      const lo = shiftMonth(ui.month, -2);
      if (String(t.date).slice(0, 7) < lo || String(t.date).slice(0, 7) > ui.month) return false;
    }
    if (f.type !== 'all' && t.type !== f.type) return false;
    if (f.cat !== 'all' && t.categoryId !== f.cat) return false;
    if (f.acc !== 'all' && t.accountId !== f.acc && t.toAccountId !== f.acc) return false;
    if (q) {
      const hay = [catName(state, t.categoryId), accName(state, t.accountId), t.note, t.date, typeLabel(t.type)].join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }

  for (const f of files) {
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const lh = [].concat(u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), Array.from(name));
    const ch = [].concat(u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset), Array.from(name));
    locals.push(new Uint8Array(lh), data);
    centrals.push(new Uint8Array(ch));
    offset += lh.length + data.length;

  return new Blob([].concat(locals, centrals, [new Uint8Array(end)]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

function parseCSV(text) {
  text = String(text).replace(/^\ufeff/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function guessCategory(text, type) {

  for (const [id, kws] of GUESS) {

    if (kws.some(k => s.indexOf(k) >= 0) && catOf(state, id)) return id;

  if (m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);

  if (m) return m[1] + '-' + m[2] + '-' + m[3];

function buildImportRecords(rows, map) {

    const r = rows[i], get = k => map[k] >= 0 ? String(r[map[k]] == null ? '' : r[map[k]]).trim() : '';
    const date = normDate(get('date'));
    const rawAmt = get('amount').replace(/[¥￥,\s]/g, '');
    const cents = parseAmount(rawAmt);
    if (!date || !cents) { skipped++; continue; }
    const note = get('note') === '/' ? '' : get('note');
    const tstr = get('type');
    let type = 'expense';
    if (/收入|增加|收款|入账|income|退还|退款/.test(tstr)) type = 'income';
    else if (/支出|减少|付款|expense/.test(tstr)) type = 'expense';
    else if (rawAmt.indexOf('-') >= 0) type = 'income';
    const cname = get('category');
    let cat = state.categories.find(c => c.type === type && cname && (c.name === cname || cname.indexOf(c.name) >= 0));
    const catId = cat ? cat.id : guessCategory(cname + ' ' + note, type);

    const key = date + '|' + cents + '|' + note;
    if (seen.has(key)) { skipped++; continue; }

async function reverseTx(id) {

function syncDraft() {
  const g = id => document.getElementById(id);
  if (!g('f-amount')) return;
  ui.draft.amount = g('f-amount').value; ui.draft.date = g('f-date').value;
  ui.draft.note = g('f-note').value; ui.draft.accountId = g('f-account').value;
  if (g('f-toaccount')) ui.draft.toAccountId = g('f-toaccount').value;
  if (g('f-party')) ui.draft.party = g('f-party').value;

}
function nextVoucher(date) { return 'P' + date.replace(/-/g, '') + '-' + String(state.tx.length + 1).padStart(3, '0'); }
async function saveTx() {
  syncDraft(); const d = ui.draft;
  const cents = parseAmount(d.amount);
  if (!cents || cents <= 0) { toast('请输入大于 0 的金额', 'err'); return; }
  if (!d.date) { toast('请选择日期', 'err'); return; }
  if (d.type === 'transfer') {
    if (!d.toAccountId || d.toAccountId === d.accountId) { toast('请选择不同的转入账户', 'err'); return; }
  } else if (!d.categoryId) { toast('请选择分类', 'err'); return; }
  const rec = { id: d.id || uid(), type: d.type, amount: cents,
    categoryId: d.type === 'transfer' ? null : d.categoryId, accountId: d.accountId,
    toAccountId: d.type === 'transfer' ? d.toAccountId : null, date: d.date,
    note: String(d.note || '').trim(), party: String(d.party || '').trim(),
    voucher: String(d.voucher || '').trim() || nextVoucher(d.date),

  if (d.id) {
    const old = state.tx.find(x => x.id === d.id);

  } else await appendChain([rec]);
  state.demo = false; save(); closeModal(); render();
  toast(d.id ? '已更新这笔记录' : '已记入不可变账本，永久留痕');

/* CSV 导入弹窗 */
const MAP_FIELDS = [['date', '日期 *'], ['amount', '金额 *'], ['type', '收支方向'], ['category', '分类'],

function openImportModal(rows) { ui.importRows = rows; ui.importMap = autoMap(rows[0]); renderImportModal(); }
function renderImportModal() {

    (prev ? '<table class="preview"><tr><th>日期</th><th>类型</th><th>金额</th><th>分类</th><th>备注</th></tr>' + prev + '</table>' : '<div class="hint">当前映射下没有解析出有效记录。</div>') +
    '<div class="hint">分类会根据交易类型与备注里的关键词自动归类（如「美团」→ 餐饮、「滴滴」→ 交通），归不进的放到「其他」，导入后可在明细里逐笔修改。</div>',

async function doImportCSV() {

/* ---------- 事件委托 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'page': ui.page = el.dataset.page; ui.printOpen = false; render(); window.scrollTo(0, 0); break;
    case 'tx-view': ui.txView = el.dataset.v; render(); break;
    case 'goto-cash': ui.page = 'tx'; ui.txView = 'cash'; render(); window.scrollTo(0, 0); break;
    case 'switch-book': switchBook(id); break;
    case 'month': ui.month = shiftMonth(ui.month, +el.dataset.d); render(); break;
    case 'toggle-theme': root.settings.theme = root.settings.theme === 'light' ? 'dark' : 'light'; save(); render(); break;
    case 'theme': root.settings.theme = el.dataset.v; save(); render(); break;
    case 'new-tx': openTxModal(); break;
    case 'edit-tx': openTxModal(id); break;
    case 'pick-type': syncDraft(); ui.draft.type = el.dataset.type; renderTxModal(); break;
    case 'pick-cat': syncDraft(); ui.draft.categoryId = id; renderTxModal(); break;
    case 'save-tx': saveTx(); break;
    case 'reverse-tx': reverseTx(id); break;
    case 'del-tx': {
      e.stopPropagation();
      const t = state.tx.find(x => x.id === id);
      if (t && isLocked(t)) { toast('已封存的账不能删除，请用红字冲销', 'err'); return; }
      openConfirm('删除这笔记录', '删除后无法恢复，确定要删除吗？', '确认删除', () => {
        state.tx = state.tx.filter(x => x.id !== id); save(); render(); toast('已删除'); });
      break;
    }
    case 'new-acc': openAccModal(); break;
    case 'edit-acc': openAccModal(id); break;
    case 'save-acc': saveAcc(); break;
    case 'del-acc': {
      const n = state.tx.filter(t => t.accountId === id || t.toAccountId === id).length;
      if (n) { toast('该账户还有 ' + n + ' 笔流水，请先修改或删除这些记录', 'err'); return; }
      openConfirm('删除账户', '删除后无法恢复，确定要删除吗？', '确认删除', () => {
        state.accounts = state.accounts.filter(x => x.id !== id); save(); render(); toast('已删除'); });
      break;
    }
    case 'new-cat': openCatModal(el.dataset.type); break;
    case 'save-cat': saveCat(); break;
    case 'del-cat': {
      const n = state.tx.filter(t => t.categoryId === id).length;
      if (n) { toast('该分类下还有 ' + n + ' 笔流水，请先改到别的分类', 'err'); return; }
      state.categories = state.categories.filter(c => c.id !== id); save(); render(); toast('分类已删除'); break;
    }
    case 'edit-budget': openBudgetModal(); break;
    case 'save-budget': saveBudgets(); break;
    case 'export-xlsx': exportXLSX(); break;
    case 'export-pdf': openReport(true); break;
    case 'export-csv': exportCSV(); break;
    case 'export-json': exportJSON(); break;
    case 'verify-chain': (async () => { await checkChain(); render();
      toast(ui.chainStatus.ok ? '校验通过：' + ui.chainStatus.count + ' 条记录链完整' : '校验失败：第 ' + ui.chainStatus.broken + ' 条异常', ui.chainStatus.ok ? '' : 'err'); })(); break;
    case 'export-chain': {
      const n = state.tx.filter(t => t.hash).length;
      if (!n) { toast('当前还没有已封存的记录，先清空示例数据并记一笔后再导出', 'err'); return; }
      download('简记_' + state.name + '_不可变账本_' + todayStr() + '.jsonl', chainText(), 'application/x-ndjson;charset=utf-8');
      toast('已导出 ' + n + ' 条不可变记录，请把文件放到不会被误删的位置'); break;
    }
    case 'import-chain': $('#file-chain').click(); break;
    case 'bind-ledger-file': LedgerFile.bind(); break;
    case 'reauth-ledger-file': LedgerFile.reauth(); break;
    case 'sync-ledger-file': LedgerFile.sync(); break;
    case 'import-csv': $('#file-csv').click(); break;
    case 'import-json': $('#file-json').click(); break;
    case 'do-import-csv': doImportCSV(); break;
    case 'close-report': ui.printOpen = false; render(); break;
    case 'do-print': try { window.print(); } catch (err) { toast('浏览器拦截了打印，请用 Ctrl/Cmd + P', 'err'); } break;
    case 'clear-demo': openConfirm('清空示例数据', '会删除全部示例流水，保留账户与分类。之后记下的每一笔都会进入不可变账本，不能改也不能删。', '清空并开始', () => {
      state.tx = state.tx.filter(t => !t._demo); state.demo = false; save(); render(); toast('已清空示例，开始记账吧'); }); break;
    case 'load-demo':
      if (state.tx.some(t => t.hash)) { toast('账本已封存，不能再载入示例数据', 'err'); return; }
      openConfirm('载入示例数据', '会用示例流水替换<b>当前账本</b>的全部记录，另一个账本不受影响。', '载入示例', () => {
        const nb = isCompany() ? seedCompanyDemo() : seedDemo();
        nb.id = root.activeBook; nb.name = state.name; nb.type = state.type;
        root.books[root.activeBook] = nb; state = nb; save(); ui.month = curMonth(); render(); toast('示例数据已载入'); }); break;
    case 'wipe':
      if (state.tx.some(t => t.hash)) { toast('已封存的账不能清空；需要归档请用「导出账本文件」', 'err'); return; }
      openConfirm('清空当前账本', '将删除「' + esc(state.name) + '」里的全部流水、账户、分类与预算，<b>不可撤销</b>；另一个账本不受影响。建议先导出一次 JSON 完整备份。', '我确认清空', () => {
        const nb = blankState(state.type); nb.id = root.activeBook; nb.name = state.name;
        root.books[root.activeBook] = nb; state = nb; ui.month = curMonth(); save(); render(); toast('当前账本已清空'); }); break;
    case 'rename-book': {
      const v = $('#book-name') ? $('#book-name').value.trim() : '';
      if (!v) { toast('账本名称不能为空', 'err'); return; }
      state.name = v; save(); render(); toast('账本名称已更新'); break;
    }
    case 'close-modal': closeModal(); break;
    case 'confirm-yes': { const fn = ui.confirmFn; ui.confirmFn = null; closeModal(); if (fn) fn(); break; }
  }
});

let composing = false, searchTimer = null;
function updateSearch(v) {
  ui.filter.q = v;
  if (ui.page !== 'tx') return;
  $('#content').innerHTML = viewTx();
  const n = $('#f-q'); if (n) { n.focus(); try { n.setSelectionRange(v.length, v.length); } catch (err) {} }
}
document.addEventListener('compositionstart', () => { composing = true; });
document.addEventListener('compositionend', e => { composing = false; if (e.target.id === 'f-q') updateSearch(e.target.value); });
document.addEventListener('input', e => {
  if (e.target.id !== 'f-q' || composing) return;
  clearTimeout(searchTimer); const v = e.target.value;
  searchTimer = setTimeout(() => updateSearch(v), 180);
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'book-sel') { switchBook(e.target.value); return; }
  if (id === 'f-type' || id === 'f-cat' || id === 'f-acc' || id === 'f-range') {
    ui.filter[id.slice(2)] = e.target.value;
    if (ui.page === 'tx') $('#content').innerHTML = viewTx();
    return;
  }
  if (e.target.dataset.map !== undefined) {
    ui.importMap[e.target.dataset.map] = +e.target.value;
    renderImportModal();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#modal-root').innerHTML) closeModal();
    else if (ui.printOpen) { ui.printOpen = false; render(); }
    return;
  }
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (e.key === 'Enter' && $('#f-amount') && tag !== 'TEXTAREA') { e.preventDefault(); saveTx(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openTxModal(); }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !ui.printOpen) {
    ui.month = shiftMonth(ui.month, e.key === 'ArrowLeft' ? -1 : 1); render();
  }
});
$('#file-csv').addEventListener('change', function () {
  const f = this.files && this.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const rows = parseCSV(r.result);
    if (rows.length < 2) { toast('CSV 里没有可导入的数据行', 'err'); return; }
    openImportModal(rows);
  };
  r.readAsText(f, 'UTF-8'); this.value = '';
});
$('#file-json').addEventListener('change', function () {
  const f = this.files && this.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const p = JSON.parse(r.result), d = p.data || p;
      const nr = Storage.migrate(d);
      if (!nr || !nr.books) throw new Error('不是有效的简记备份');
      assertMonotonicRoot(nr);
      const nBook = Object.keys(nr.books).length;
      const nTx = Object.values(nr.books).reduce((s, b) => s + b.tx.length, 0);
      openConfirm('恢复备份', '将用备份里的 <b>' + nBook + '</b> 个账本、<b>' + nTx + '</b> 笔流水整体替换当前全部数据。当前数据会被覆盖，建议先导出一次备份。', '确认恢复', () => {
        root = nr; state = root.books[root.activeBook]; state.demo = false;
        ui.txView = state.type === 'company' ? 'cash' : 'list';
        ui.page = 'dash'; ui.month = curMonth(); save(); render(); toast('备份已恢复');
      });
    } catch (err) { toast('读取失败：' + err.message, 'err'); }
  };
  r.readAsText(f, 'UTF-8'); this.value = '';
});
if (window.matchMedia) {
  const mq = matchMedia('(prefers-color-scheme: light)');
  if (mq.addEventListener) mq.addEventListener('change', () => { if (root.settings.theme === 'system') render(); });
}

$('#file-chain').addEventListener('change', function () {
  const f = this.files && this.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try { await restoreChain(r.result, f.name); }
    catch (err) { toast('恢复失败：' + err.message, 'err'); }
  };
  r.readAsText(f, 'UTF-8'); this.value = '';
});

/* ---------- 启动 ---------- */
(async function init() {
  if (!localStorage.getItem(KEY)) save();
  await migrateAllBooks();
  await LedgerFile.init();
  await checkChain();
  render();
})();
</script>
</body>
</html>
