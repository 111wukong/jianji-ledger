name: 发布简记外部锚点

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jianji-external-anchor
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 重算并发布最新公开锚点
        env:
          LEDGER_URL: ${{ vars.LEDGER_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish-anchor.mjs
      - name: 仅在锚点前进时提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A anchoring
          if git diff --cached --quiet; then
            echo "没有新锚点"
            exit 0
          fi
          git commit -m "chore: 锚定简记公开哈希 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
