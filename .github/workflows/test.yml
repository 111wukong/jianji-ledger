name: 核心测试与单文件构建

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 核心纯函数测试 + 服务端 HTTP 集成测试
        run: npm test
      - name: 灾难恢复演练（删库后从加密备份还原）
        run: npm run drill:restore
      - run: npm run build
      - name: 确认单文件构建产物已同步
        run: git diff --exit-code local/index.html
